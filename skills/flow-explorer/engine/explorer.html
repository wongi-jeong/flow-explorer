/* 색은 모두 이 변수로 정한다. 데이터 폴더의 CSS(data.json의 "css")가 같은 변수를 덮어써 색을 바꿀 수 있다. */
:root {
  color-scheme: light;
  --bg:#F6F7F5; --panel:#FFFFFF; --panel-2:#F1F4F2;
  --line:#B3BFBB; --rule:#DCE3E0; --rule-2:#E8EEEB; --link:#C3CFCB;
  --grid:rgba(16,94,84,.05);
  --ink:#1E2B2A; --ink-strong:#0E1918; --ink-2:#33433F; --muted:#566763; --faint:#7A8A86; --fainter:#A6B3AF;
  --tint:#DDEFEB; --btn:#0F766E;
  --req:#F2B631; --req-ink:#855A00; --on-req:#2F2200;
  --resp:#7656EE; --resp-ink:#5A3FCF;
  --accent:#0D8A7F; --seen:rgba(13,138,127,.34);
  --sel-bg:#E6F4F1; --sel-bd:#0D8A7F; --now:#E3A008;
  --tile:#FFFFFF; --tile-bd:#B3BFBB; --grp:#F3F6F4;
  --ok:#15964A; --chev-on:#0D8A7F;
  --iso-top:#FBFCFB; --iso-left:#E1E9E6; --iso-right:#C5D3CF; --iso-ln:#2B4541; --iso-gl:#0D8A7F; --iso-scr:#DCEFEA;
  --iso-top2:#EFF4F2; --iso-left2:#D1DDD9; --iso-right2:#B2C4BF; --iso-hl:rgba(255,255,255,.9); --iso-bay:#CBDAD5; --iso-glare:rgba(255,255,255,.55);
  --iso-sh1:rgba(14,40,36,.20);
  --iso-led:#0D8A7F; --iso-pad:#EDF2F0; --iso-padln:#C7D3CF; --iso-sh:rgba(14,40,36,.10); --pad-q:rgba(242,182,49,.22); --pad-s:rgba(118,86,238,.18);
  --shadow:rgba(14,40,36,.16);
  --pulse-a:rgba(13,138,127,.45); --pulse-q:rgba(242,182,49,.55); --pulse-s:rgba(118,86,238,.5); --pulse-play:rgba(15,118,110,.45);
  --font:"Iosevka", "FlowHangul", "FlowJapanese", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", ui-monospace, monospace;
}
/* 일본어 화면: 가나·한자는 일본어 글꼴로(한국어 글꼴의 한자는 모양이 다르다) */
html[lang="ja"] { --font:"Iosevka", "FlowJapanese", "FlowHangul", "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans JP", ui-monospace, monospace; }
[data-theme="dark"] {
  color-scheme: dark;
  --bg:#0C1211; --panel:#111917; --panel-2:#16211F;
  --line:#33504A; --rule:#203230; --rule-2:#1A2826; --link:#2A433E;
  --grid:rgba(110,200,185,.06);
  --ink:#C5D6D2; --ink-strong:#FFFFFF; --ink-2:#ABBEB9; --muted:#8BA19C; --faint:#6C837E; --fainter:#44605A;
  --tint:#173430; --btn:#0E7F75;
  --req:#F5C24C; --req-ink:#FFD47A; --on-req:#221800;
  --resp:#9076F2; --resp-ink:#B7A4F8;
  --accent:#2CCDB8; --seen:rgba(44,205,184,.38);
  --sel-bg:#14302B; --sel-bd:#2CCDB8; --now:#E3A008;
  --tile:#16211F; --tile-bd:#33504A; --grp:rgba(44,160,140,.12);
  --ok:#2DB86E; --chev-on:#2CCDB8;
  --iso-top:#22403B; --iso-left:#182E2A; --iso-right:#11221F; --iso-ln:#8ED1C5; --iso-gl:#D2F2EC; --iso-scr:#1B4740;
  --iso-top2:#1E3935; --iso-left2:#142824; --iso-right2:#0D1B19; --iso-hl:rgba(170,235,222,.42); --iso-bay:#0C1A18; --iso-glare:rgba(150,230,215,.2);
  --iso-sh1:rgba(0,0,0,.5);
  --iso-led:#2CCDB8; --iso-pad:#111C1A; --iso-padln:#29433E; --iso-sh:rgba(0,0,0,.35); --pad-q:rgba(245,194,76,.20); --pad-s:rgba(144,118,242,.22);
  --shadow:rgba(0,0,0,.45);
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px; }
button, select { font:inherit; color:inherit; }
code { font-family:var(--font); color:var(--ink-strong); }

.app { display:grid; grid-template-rows:auto minmax(0,1fr); gap:12px; height:100vh; min-height:640px; padding:12px; }
.panel { border:1.2px solid var(--line); border-radius:2px; background:var(--panel); display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.panel > h2 { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px 10px; border-bottom:1px solid var(--rule);
  font-size:19px; font-weight:800; letter-spacing:.05em; color:var(--ink); }
.panel > h2 .k { font-size:11.5px; font-weight:600; letter-spacing:.06em; color:var(--faint); }
.scroll { overflow:auto; min-height:0; flex:1; }

/* header: 제목 · 지금 보는 흐름 · 진행률 · 도구. 단계 진행 막대는 머리 아래 끝을 따라 한 줄로 그린다 */
.top { flex-direction:row; align-items:center; gap:24px; padding:12px 18px 15px; overflow:visible; position:relative; z-index:20; }   /* 언어 메뉴가 아래 패널 위에 뜨게 */
.logo { flex:none; }
.logo .lg-bg { fill:var(--btn); }
.logo .lg-box { fill:none; stroke:#fff; stroke-width:2.4; }
.logo .lg-q, .logo .lg-s { fill:none; stroke-width:2.4; stroke-linejoin:round; }
.logo .lg-q { stroke:var(--req); }
.logo .lg-s { stroke:color-mix(in srgb, var(--resp) 45%, #fff); }
.brand h1 { font-size:24px; font-weight:800; letter-spacing:.04em; color:var(--ink); line-height:1.1; text-wrap:balance; word-break:auto-phrase; }
html[lang="ja"] .brand h1 { font-size:21px; letter-spacing:.02em; }   /* 전각 글자는 같은 크기에서 더 넓다 */
.brand { flex-shrink:0; max-width:30vw; }   /* 단계를 넘길 때 제목 칸이 줄었다 늘었다 하지 않게 */
.brand .sub { font-size:12.5px; letter-spacing:.08em; color:var(--faint); margin-top:3px; text-wrap:balance; word-break:auto-phrase; }
.lbl { font-size:11.5px; font-weight:800; letter-spacing:.04em; color:var(--muted); }
.now { flex:1 1 300px; min-width:0; max-width:520px; }   /* 글 길이와 상관없이 폭을 고정하고 넘치면 말줄임 */
.now .v, .now .s, .now .lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.now .v { font-size:17px; font-weight:800; letter-spacing:.02em; color:var(--ink-strong); margin-top:2px; white-space:nowrap; }
.now .s { font-size:12px; letter-spacing:.04em; color:var(--muted); margin-top:1px; white-space:nowrap; }
.prog { flex:0 1 auto; min-width:0; text-align:right; margin-left:auto; }
.prog .pct { font-size:22px; font-weight:800; letter-spacing:.02em; color:var(--ink-strong); line-height:1.1; }
.prog .s { font-size:12px; letter-spacing:.04em; color:var(--muted); margin-top:3px; max-width:320px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.segs { position:absolute; left:0; right:0; bottom:0; display:flex; gap:3px; height:4px; }
.segs .g { display:flex; gap:1px; min-width:0; }
.segs i { flex:1; background:var(--rule-2); }
.segs i.on { background:var(--accent); }
.segs i.cur { background:var(--btn); }
/* 전체 진행(흐름마다 끝까지 봤는지): 왼쪽 흐름 목록 위 */
.tot { margin:0 18px 14px; }
.tot .row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.tsegs { display:flex; gap:3px; margin-top:6px; height:6px; }
.tsegs i { flex:1; background:var(--rule-2); transition:background-color .3s; }
.tsegs i.now { background:var(--now); } .tsegs i.done { background:var(--ok); }
.tsegs i.cur { box-shadow:0 0 0 1.5px var(--panel), 0 0 0 3px var(--btn); }
.tot .s { min-width:0; font-size:11.5px; letter-spacing:.03em; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg { display:flex; border:1.2px solid var(--line); border-radius:2px; overflow:hidden; flex:none; }
.seg button { border:0; background:none; padding:7px 12px; font-size:12.5px; font-weight:800; letter-spacing:.06em; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:6px; }
.seg button + button { border-left:1.2px solid var(--line); }
.seg button.on { background:var(--btn); color:#fff; }
.seg svg { width:16px; height:16px; }
/* 도구: 언어 메뉴(언어가 둘 이상일 때만 보인다)와 테마 단추 */
.tools { display:flex; align-items:stretch; gap:8px; flex:none; }
.lang { position:relative; display:flex; }
.lang[hidden] { display:none; }
.lang-btn { display:flex; align-items:center; gap:8px; border:1.2px solid var(--line); border-radius:2px; background:none; padding:6px 10px 6px 12px; font:inherit; font-size:12.5px; font-weight:800; letter-spacing:.03em; color:var(--ink); cursor:pointer; }
.lang-btn:hover { background:var(--panel-2); }
.lang-btn .caret { width:10px; height:10px; fill:currentColor; transition:transform .2s; }
.lang-btn[aria-expanded="true"] .caret { transform:rotate(180deg); }
.lang-list { position:absolute; right:0; top:calc(100% + 6px); z-index:40; min-width:168px; padding:6px; border:1.2px solid var(--line); border-radius:2px; background:var(--panel); box-shadow:0 10px 28px var(--shadow); display:grid; gap:2px; animation:kfSlide .18s ease both; }
.lang-list[hidden] { display:none; }
.lang-list button { display:grid; grid-template-columns:16px 1fr auto; align-items:center; gap:8px; border:0; background:none; padding:7px 10px; font:inherit; font-size:13px; font-weight:800; color:var(--ink); cursor:pointer; border-radius:2px; text-align:left; }
.lang-list button:hover, .lang-list button:focus-visible { background:var(--panel-2); }
.lang-list button b { font-size:11px; letter-spacing:.06em; color:var(--faint); }
.lang-list button .ck { visibility:hidden; color:var(--accent); display:flex; }
.lang-list button[aria-checked="true"] .ck { visibility:visible; }
/* 테마 단추: 누르면 바뀔 테마의 그림(라이트에서는 달, 다크에서는 해)을 보인다 */
.icon-btn { display:grid; place-items:center; width:36px; border:1.2px solid var(--line); border-radius:2px; background:none; color:var(--ink); cursor:pointer; }
.icon-btn:hover { background:var(--panel-2); }
.icon-btn svg { width:17px; height:17px; }
.theme .i-sun, [data-theme="dark"] .theme .i-moon { display:none; }
[data-theme="dark"] .theme .i-sun { display:block; }

/* main */
.main { display:grid; grid-template-columns:clamp(300px,27vw,392px) minmax(0,1fr) clamp(280px,22vw,340px); grid-template-rows:minmax(0,1fr); gap:10px; min-height:0; }
.side { grid-column:1; grid-row:1; }
.stage { grid-column:2; grid-row:1; position:relative; }
.detail { grid-column:3; grid-row:1; }

/* flow list */
.side > h2 { font-size:24px; letter-spacing:.06em; padding:16px 18px 12px; border-bottom:0; }
.more-btn { border:0; background:none; font-size:22px; font-weight:800; line-height:1; color:var(--ink); cursor:pointer; padding:0 6px 6px; border-radius:2px; }
.more-btn:hover { background:var(--panel-2); }
.menu { margin:0 18px 12px; padding:8px; border:1.2px solid var(--line); border-radius:2px; background:var(--panel); display:grid; gap:4px; animation:kfSlide .22s ease both; }
.menu[hidden] { display:none; }
.menu button { text-align:left; border:0; background:none; padding:7px 8px; font-size:13px; font-weight:800; color:var(--ink); cursor:pointer; border-radius:2px; }
.menu button:hover { background:var(--panel-2); }
.menu .mk { font-size:11.5px; color:var(--muted); padding:4px 8px 2px; line-height:1.7; }
.ftabs { display:flex; margin:0 18px 14px; border:1.2px solid var(--line); border-radius:2px; }
.ftabs button { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:8px 4px; border:0; background:none; cursor:pointer;
  font-size:12.5px; font-weight:800; letter-spacing:.03em; color:var(--ink); white-space:nowrap; transition:background-color .2s, box-shadow .2s; }
.ftabs button + button { border-left:1.2px solid var(--line); }
.ftabs button:hover { background:var(--panel-2); }
.ftabs .n { display:inline-grid; place-items:center; min-width:19px; height:17px; padding:0 5px; border-radius:9px; font-size:10.5px; background:var(--rule-2); color:var(--muted); }
.ftabs button.on { color:var(--ink-strong); box-shadow:inset 0 -2.5px 0 var(--btn); }
.ftabs button.on .n { background:var(--btn); color:#fff; }
#list { padding:0 18px 14px; }
.sc { border-bottom:1px solid var(--rule); }
.sc > button { display:grid; grid-template-columns:18px 1fr auto 14px; gap:12px; align-items:center; width:100%; padding:12px 10px; border:0; background:none; cursor:pointer; text-align:left; border-radius:2px; }
.sc .dot { display:inline-grid; place-items:center; width:16px; height:16px; border-radius:50%; border:1.6px solid var(--fainter); background:var(--panel); }
.sc .dot.now { background:var(--now); border-color:var(--now); }
.sc .dot.done { background:var(--ok); border-color:var(--ok); }
.dot svg, .gn svg, .pn svg { width:10px; height:10px; fill:none; stroke:#fff; stroke-width:2.9; stroke-linecap:round; stroke-linejoin:round; }
/* 흐름을 펼치는 표시: 채운 삼각형이 열리면 아래로 돈다 */
.chev { display:grid; place-items:center; }
.chev svg { width:12px; height:12px; fill:var(--faint); stroke:none; transition:transform .2s, fill .2s; }
.sc.on .chev svg { transform:rotate(90deg); fill:var(--chev-on); }
.sc .t { font-size:15px; font-weight:800; letter-spacing:.02em; color:var(--ink-strong); }
.sc .d { font-size:12.5px; color:var(--muted); margin-top:2px; }
.sc .c { font-size:11.5px; font-weight:600; color:var(--faint); letter-spacing:.04em; }
.sc.on > button { background:var(--sel-bg); box-shadow:inset 3px 0 0 var(--sel-bd); }
.gl { display:none; padding:8px 2px 12px 6px; }
.sc.on .gl { display:block; }
.gph { font-size:11px; font-weight:800; color:var(--faint); letter-spacing:.04em; padding:8px 6px 3px; }
.gh { display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:9px; align-items:start; width:100%; padding:6px 6px; border:0; background:none; cursor:pointer; text-align:left; border-radius:2px; }
.gh:hover { background:var(--panel-2); }
.gr { position:relative; }
.gr:not(:last-child)::before { content:""; position:absolute; left:16.5px; top:31px; bottom:-5px; border-left:2px dashed var(--line); }
.gr.done:not(:last-child)::before { border-left-color:var(--ok); }
.gn { position:relative; z-index:1; display:inline-grid; place-items:center; width:23px; height:23px; border-radius:50%; background:var(--fainter); color:#fff; font-size:10.5px; font-weight:800; }
.gr.done .gn { background:var(--ok); }
.gr.on .gn { background:var(--panel); border:2.2px solid var(--accent); color:var(--accent); }
.gtx { min-width:0; }
.gt, .gd2 { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gt { font-size:14px; font-weight:800; color:var(--ink-strong); line-height:1.3; }
.gd2 { font-size:11.5px; color:var(--muted); margin-top:1px; }
.gc { font-size:11px; font-weight:600; color:var(--faint); white-space:nowrap; padding-top:2px; }
.gr ol { list-style:none; padding:2px 0 8px 30px; }
.gr li { position:relative; display:grid; grid-template-columns:20px minmax(0,1fr); gap:8px; align-items:start; padding:4px 6px; border-radius:2px; cursor:pointer; }
.gr li:hover { background:var(--panel-2); }
.gr li:not(:last-child)::before { content:""; position:absolute; left:14.5px; top:25px; bottom:-4px; border-left:2px dashed var(--fainter); }
.gr li.done:not(:last-child)::before { border-left-color:var(--ok); }
.pn { position:relative; z-index:1; display:inline-grid; place-items:center; width:19px; height:19px; border-radius:50%; background:var(--fainter); color:#fff; font-size:9.5px; font-weight:800; margin-top:1px; }
.gr li.done .pn { background:var(--ok); }
.gr li.cur { background:var(--tint); }
/* 번호 원: 요청은 노랑, 응답은 보라로 꽉 채우고 숫자는 흰색 */
.gr li.cur .pn { background:var(--req); border:0; color:#fff; }
.gr li.cur.s .pn { background:var(--resp); }
.gr li.cur.arrived .pn, .gr li.cur.s.arrived .pn { background:var(--ok); border:0; color:#fff; animation:none; }
.gr.on.arrived .gn { background:var(--ok); border:0; color:#fff; animation:none; }
/* 목록 애니메이션: 펼칠 때 차례로 떠오름, 막 지난 곳은 톡 튀며 체크가 그려지고 선이 초록으로 자람, 지금 단계는 맥박 */
@keyframes kfRise { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
@keyframes kfPop { 0% { transform:scale(.55); } 60% { transform:scale(1.18); } 100% { transform:scale(1); } }
@keyframes kfDraw { from { stroke-dashoffset:1; } to { stroke-dashoffset:0; } }
@keyframes kfGrow { from { transform:scaleY(0); } to { transform:scaleY(1); } }
@keyframes kfPulseA { 0% { box-shadow:0 0 0 0 var(--pulse-a); } 70% { box-shadow:0 0 0 7px transparent; } 100% { box-shadow:0 0 0 0 transparent; } }
@keyframes kfPulseQ { 0% { box-shadow:0 0 0 0 var(--pulse-q); } 70% { box-shadow:0 0 0 6px transparent; } 100% { box-shadow:0 0 0 0 transparent; } }
@keyframes kfPulseS { 0% { box-shadow:0 0 0 0 var(--pulse-s); } 70% { box-shadow:0 0 0 6px transparent; } 100% { box-shadow:0 0 0 0 transparent; } }
.gl.enter .gr, .gr ol.enter li { animation:kfRise .38s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 45ms); }
.justdone > .gh .gn, li.justdone .pn, .dot.justdone, .gr li.cur.arrived.justdone .pn, .gr.on.arrived.justdone > .gh .gn { animation:kfPop .42s cubic-bezier(.2,.8,.2,1); }
/* 숨긴 채 시작하는 상태는 애니메이션(both)에만 둔다. 동작 줄이기로 애니메이션이 꺼지면 체크가 다 그려진 채로 보인다. */
.justdone > .gh .gn svg path, li.justdone .pn svg path, .dot.justdone svg path { stroke-dasharray:1; animation:kfDraw .34s .14s ease-out both; }
.gr.justdone::before, .gr li.justdone::before { transform-origin:top; animation:kfGrow .45s .1s ease-out both; }
.gr.on .gn { animation:kfPulseA 1.9s ease-out infinite; }
.gr li.cur.q .pn { animation:kfPulseQ 1.9s ease-out infinite; }

  if (q && LANGS.indexOf(q) >= 0) return q;
  try { s = localStorage.getItem("flow-explorer:lang"); } catch (e) {}
  if (s && LANGS.indexOf(s) >= 0) return s;
  for (var i = 0; i < nav.length; i++) { var c = String(nav[i]).toLowerCase().split("-")[0]; if (LANGS.indexOf(c) >= 0) return c; }
  return BASE;
}
function langOpen(on) {

$("langMenu").addEventListener("click", function (e) {

});
document.addEventListener("click", function (e) { if (!$("langMenu").hidden && !e.target.closest("#lang")) langOpen(false); });
